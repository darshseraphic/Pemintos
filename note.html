<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Note — Pemintos</title>
  <link rel="stylesheet" href="note.css">
  <script src="note.js" defer></script>
</head>
<body>
  <main class="note-app" id="top">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Pemintos top">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <path d="M8 7.5h7.1a4.4 4.4 0 0 1 0 8.8H12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M20 20.5h-7.1a4.4 4.4 0 0 1 0-8.8H16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-name">pemintos</span>
      </a>

      <div class="topbar-actions">
        <button class="quiet-button" id="closeEditorButton" type="button">Close editor</button>
        <button class="theme-button" id="themeButton" type="button" aria-label="Change color theme" title="Change color theme">
          <svg class="theme-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="6.4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 3.6a6.4 6.4 0 0 1 0 12.8V3.6Z" fill="currentColor"/>
          </svg>
          <span id="themeLabel">System</span>
        </button>
      </div>
    </header>

    <section class="note-intro">
      <p class="eyebrow">YOUR SAVED NOTE</p>
      <div class="title-line">
        <div>
          <h1 id="noteTitle">Opening note…</h1>
          <p class="note-description">Edit your note here. Changes stay in Pemintos on this device.</p>
        </div>
        <div class="save-state" id="saveState" role="status" aria-live="polite">
          <span class="state-dot" aria-hidden="true"></span>
          <span id="saveStateText">Loading note…</span>
        </div>
      </div>
    </section>

    <section class="editor-card" aria-labelledby="editorHeading">
      <div class="editor-head">
        <div>
          <h2 id="editorHeading">Note contents</h2>
          <p class="editor-subtitle" id="fileNameLabel">.txt</p>
        </div>
        <span class="word-count" id="wordCount">0 words</span>
      </div>
      <label class="visually-hidden" for="noteEditor">Edit your saved note</label>
      <textarea id="noteEditor" spellcheck="true" placeholder="This note is empty…" disabled></textarea>
      <div class="editor-foot">
        <span id="updatedLabel">Saved locally in Pemintos</span>
        <span>Plain text</span>
      </div>
    </section>

    <div class="action-row">
      <button class="button button-primary" id="saveChangesButton" type="button" disabled>
        <span>Save changes</span>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="m4 10.3 4 4 8-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="button button-secondary" id="downloadButton" type="button" disabled>
        <span>Download .txt</span>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2.8v9.1m0 0 3.5-3.5M10 11.9 6.5 8.4M3.5 13.2v2.3c0 .6.4 1 1 1h11c.6 0 1-.4 1-1v-2.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <footer class="footer">
      <div class="privacy-mark" aria-hidden="true">
        <svg viewBox="0 0 18 18" fill="none">
          <path d="M9 2.2 14.5 4v4.2c0 3.6-2.3 6.1-5.5 7.6-3.2-1.5-5.5-4-5.5-7.6V4L9 2.2Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
          <path d="m6.5 8.8 1.6 1.6 3.5-3.6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="footer-copy">
        <strong>Just you and your words.</strong>
        <span>Your note remains stored locally by Chrome.</span>
      </div>
      <span class="version">PEMINTOS</span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
